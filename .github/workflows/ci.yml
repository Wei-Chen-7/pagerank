name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check pagerank tests examples

      - name: Ruff format check
        run: ruff format --check pagerank tests examples

      - name: Mypy type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          pagerank examples/web_of_influence.edgelist --top 3
          python -m pagerank examples/web_of_influence.edgelist --sparse --format json --top 3

      - name: Smoke-test the examples
        run: |
          python examples/visualize_graph.py
          python examples/indegree_vs_pagerank.py
          python examples/personalized_pagerank.py
          python examples/convergence_study.py
